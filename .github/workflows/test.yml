name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://user:password@localhost:5432/open_crosswords
  BETTER_AUTH_SECRET: ci-only-not-a-real-secret-do-not-reuse
  BETTER_AUTH_URL: http://localhost:3100
  ADMIN_EMAILS: e2e-admin@example.com
  # The e2e server is `next start` on localhost with no proxy in front, so no
  # forwarded-for header is worth believing. Empty says so explicitly, which
  # src/lib/env.ts requires of any production boot outside Vercel.
  AUTH_IP_HEADER: ""

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: open_crosswords
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d open_crosswords"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run db:migrate

      - run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
